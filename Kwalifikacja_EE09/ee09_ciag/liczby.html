<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ciągi liczbowe</title>
        <link rel="stylesheet" href="styl2.css" />
    </head>
    <body>
        <section id="baner1">
        <h2>Poznaj ciągi liczbowe</h2>        
        </section>
        <section id="baner2">
            <a href="liczby.html"><h5>Ciągi arytmetyczne</h5></a>
        </section>
        <section id="baner3">
            <a href="fib.html"><h5>Ciąg Fibonacciego</h5></a>
        </section>
        <section id="baner4">
            <img src="obraz1.png" alt="Fibonacci">
        </section>
        <section id="lewy">
            <ol>
            <li>ciągi arytmetyczne</li>
                <li>ciągi geometryczne</li>
                <li>ciąg Fibonacciego</li>
            </ol>
        </section>
        <section id="prawy">
            <h2>Generowanie ciągu arytmetycznego</h2>
            <div>
                Pierwszy wyraz A1: <input type="number" name="" id="first" />
            </div>
            <div>
                Różnica ciągu R: <input type="number" name="" id="roznica" />
            </div>
            <div>
                Liczba wyrazów w ciągu N:
                <input type="number" name="count" id="count" />
            </div>
            <button onclick="Ciag()">Generuj Ciąg</button>
            <div id="wynik"></div>
        </section>
        <script>
            function Ciag() {
                var first = Number(document.getElementById("first").value);
                var roz = Number(document.getElementById("roznica").value);
                var ile = Number(document.getElementById("count").value);
                var wynik = "Ciąg arytmetyczny zawiera wyrazy: ";
                for (let i = 0; i < ile; i++) {
                    wynik += first + ", ";
                    first += roz;
                }
                document.getElementById("wynik").innerHTML = wynik;
            }
        </script>
        
        
        <footer><p>Autor:0000000</p></footer>

    </body>
</html>
