<!DOCTYPE html>
<html lang="pl-PL">
<head>
	<meta charset="utf-8">
	<title>JS16</title>
	
	<script>
		function wykonaj()
		{
			var imie = document.getElementById("imie").value;
			var nazwisko = document.getElementById("nazwisko").value;
			var mail = document.getElementById("mail").value;
			var usluga = document.getElementById("usluga").value;
			var kopia = document.getElementById("kopia").checked;
			
			if(kopia)
			{
				document.getElementById("wynik").innerHTML = imie + " " + nazwisko+"<br>"+mail.toLowerCase()+"<br>"+"Usługa: "+usluga;
			}
			else document.getElementById("wynik").innerHTML = "";
		}
	</script>
	
</head>
<body>

	<h3>Formularz kontaktowy</h3>
	
	<form>
		<table>
			<tr>
				<td>Imię:</td>
				<td><input type="text" id="imie"></td>
			</tr>
			
			<tr>
				<td>Nazwisko:</td>
				<td><input type="text" id="nazwisko"></td>
			</tr>
			
			<tr>
				<td>E-mail:</td>
				<td><input type="text" id="mail"></td>
			</tr>
			
			<tr>
				<td>Usługa:</td>
				<td>
					<select id="usluga">
						<option value="naprawa komputera">naprawa komputera</option>
						<option value="odzyskiwanie danych">odzyskiwanie danych</option>
						<option value="problemy z oprogramowaniem">problemy z oprogramowaniem</option>
						<option value="konfiguracja sieci LAN">konfiguracja sieci LAN</option>
						<option value="inne">inne</option>
					</select>
				</td>
			</tr>
			
			<tr>
				<td></td>
				<td><input type="checkbox" id="kopia" checked>Wyślij kopię wiadomości</td>
			</tr>
			
			<tr>
				<td></td>
				<td><input type="reset" id="reset" value="Resetuj" style="background-color: red"> <input type="button" id="przeslij" value="Prześlij" style="background-color: green" onclick="wykonaj()"></td>
			</tr>
		</table>
	</form>
	
	<p id="wynik"></p>
</body>
</html>
