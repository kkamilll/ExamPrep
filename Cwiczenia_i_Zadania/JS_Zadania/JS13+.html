<!DOCTYPE html>
<html lang="pl-PL">
<head>
	<meta charset="utf-8">
	<title>JS13</title>
	<style>
		#czerwony
		{
			background-color: red;
			min-width:  20px;
			min-height: 20px;
		}
		
		#zielony
		{
			background-color: green;
			min-width:  20px;
			min-height: 20px;
		}
		
		#niebieski
		{
			background-color: blue;
			min-width:  20px;
			min-height: 20px;
		}
	</style>
	
	<script>
		function czerw()
		{
			var rozmiar = document.getElementById("rozmiar").value;
			var rodzaj = document.getElementById("rodzaj").value;
			
			document.getElementById("wynik").style.fontSize = rozmiar+"%";
			document.getElementById("wynik").style.fontStyle = rodzaj;
			document.getElementById("wynik").style.color = "red";
		}
		
		function ziel()
		{
			var rozmiar = document.getElementById("rozmiar").value;
			var rodzaj = document.getElementById("rodzaj").value;
			
			document.getElementById("wynik").style.fontSize = rozmiar+"%";
			document.getElementById("wynik").style.fontStyle = rodzaj;
			document.getElementById("wynik").style.color = "green";
		}
		
		function nieb()
		{
			var rozmiar = document.getElementById("rozmiar").value;
			var rodzaj = document.getElementById("rodzaj").value;
			
			document.getElementById("wynik").style.fontSize = rozmiar+"%";
			document.getElementById("wynik").style.fontStyle = rodzaj;
			document.getElementById("wynik").style.color = "blue";
		}
	</script>
	
</head>
<body>
	<form>
		<label>Podaj rozmiar tekstu w procentach: <br><br>
		<input type="number" id="rozmiar"> %</label> <br><br>
		
		<select id="rodzaj">
			<option value="normal">prosty</option>
			<option value="italic">pochyły</option>
		</select> <br><br>
		
		Jakim kolorem sformatować tekst? Wybierz przycisk. <br><br>
		<input type="button" id="czerwony" onclick="czerw()">
		<input type="button" id="zielony" onclick="ziel()">
		<input type="button" id="niebieski" onclick="nieb()">
	</form>
	
	<p id="wynik">To jest przykład paragrafu, który może być dowolnie formatowany przez JavaScript.</p>
</body>
</html>
